name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Also verifies the Gradle wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.SCROLLSTOP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the SCROLLSTOP_KEYSTORE_BASE64 secret before tagging a release (see SECURITY.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SCROLLSTOP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint, check permissions and build
        env:
          SCROLLSTOP_KEYSTORE_PASSWORD: ${{ secrets.SCROLLSTOP_KEYSTORE_PASSWORD }}
          SCROLLSTOP_KEY_ALIAS: ${{ secrets.SCROLLSTOP_KEY_ALIAS }}
          SCROLLSTOP_KEY_PASSWORD: ${{ secrets.SCROLLSTOP_KEY_PASSWORD }}
        run: ./gradlew check assembleRelease

      - name: Checksum and signing certificate
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" ScrollStop.apk
          sha256sum ScrollStop.apk | tee ScrollStop.apk.sha256
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs ScrollStop.apk | tee signing-certificate.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ScrollStop
          path: |
            ScrollStop.apk
            ScrollStop.apk.sha256
            signing-certificate.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScrollStop
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ScrollStop.apk ScrollStop.apk.sha256 signing-certificate.txt \
            --repo "$GITHUB_REPOSITORY" --title "ScrollStop $GITHUB_REF_NAME" --generate-notes
